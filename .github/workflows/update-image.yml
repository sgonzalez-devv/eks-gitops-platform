name: Update Image Tag

# Called by application repos after a successful image push to ECR.
# Opens a PR against main — merge triggers ArgoCD sync.
#
# Usage from an app repo:
#   gh workflow run update-image \
#     --repo sgonzalez-devv/eks-gitops-platform \
#     -f app=sentinel-uptime \
#     -f environment=production \
#     -f image_tag=abc1234

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App name (must match helm/app/values/<app>/<env>.yaml)"
        required: true
      environment:
        description: "Target environment"
        required: true
        default: production
        type: choice
        options: [staging, production]
      image_tag:
        description: "New image tag (git SHA or semver)"
        required: true

  # Also accepts repository_dispatch for programmatic triggers
  repository_dispatch:
    types: [update-image]

jobs:
  update:
    name: Bump ${{ github.event.inputs.app || github.event.client_payload.app }}
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve inputs
        id: inputs
        run: |
          APP="${{ github.event.inputs.app || github.event.client_payload.app }}"
          ENV="${{ github.event.inputs.environment || github.event.client_payload.environment }}"
          TAG="${{ github.event.inputs.image_tag || github.event.client_payload.image_tag }}"
          echo "app=$APP"         >> $GITHUB_OUTPUT
          echo "env=$ENV"         >> $GITHUB_OUTPUT
          echo "tag=$TAG"         >> $GITHUB_OUTPUT
          echo "values_file=helm/app/values/$APP/$ENV.yaml" >> $GITHUB_OUTPUT
          echo "branch=gitops/update-$APP-$ENV-$TAG"        >> $GITHUB_OUTPUT

      - name: Validate values file exists
        run: |
          if [ ! -f "${{ steps.inputs.outputs.values_file }}" ]; then
            echo "ERROR: ${{ steps.inputs.outputs.values_file }} not found"
            exit 1
          fi

      - name: Update image tag in values file
        run: |
          FILE="${{ steps.inputs.outputs.values_file }}"
          TAG="${{ steps.inputs.outputs.tag }}"

          # Replace `tag: <anything>` with the new tag
          sed -i "s/^  tag: .*/  tag: $TAG/" "$FILE"

          echo "Updated $FILE:"
          grep "tag:" "$FILE"

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.inputs.outputs.branch }}
          base: main
          commit-message: "gitops(${{ steps.inputs.outputs.app }}): bump image to ${{ steps.inputs.outputs.tag }}"
          title: "gitops(${{ steps.inputs.outputs.app }}): deploy ${{ steps.inputs.outputs.tag }} to ${{ steps.inputs.outputs.env }}"
          body: |
            ## GitOps Deploy

            | Field | Value |
            |-------|-------|
            | App | `${{ steps.inputs.outputs.app }}` |
            | Environment | `${{ steps.inputs.outputs.env }}` |
            | Image tag | `${{ steps.inputs.outputs.tag }}` |
            | Values file | `${{ steps.inputs.outputs.values_file }}` |

            Merging this PR will trigger ArgoCD to roll out the new image.

            > Auto-generated by the [update-image workflow](/.github/workflows/update-image.yml)
          labels: gitops,automated
          delete-branch: true
